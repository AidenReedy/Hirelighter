# Hirelighter: pulls the published image. To build from source instead, see docker-compose.dev.yml.
services:
  hirelighter:
    image: ${IMAGE:-ghcr.io/aidenreedy/hirelighter:latest}
    container_name: hirelighter
    restart: unless-stopped
    ports:
      # Listens on all of this machine's IPs (LAN, Tailscale, ...) by default.
      # To restrict it to one address, set BIND_IP in .env (e.g. 127.0.0.1 or a Tailscale 100.x IP).
      - "${BIND_IP:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-UTC}                    # for dates the server fills in, e.g. America/Los_Angeles
      MAX_BULLET_CHARS: ${MAX_BULLET_CHARS:-107}
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}   # optional basic auth; empty = off
    volumes:
      - hirelighter-data:/data          # database + copies of every resume you've sent
    read_only: true
    tmpfs:
      - /tmp:size=128m                  # LaTeX builds happen here
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Optional Gmail rejection tracking: `docker compose --profile mail up -d` (setup in the README).
  # Only this service gets the Gmail app password; the web app never sees it.
  hirelighter-mail:
    image: ${IMAGE:-ghcr.io/aidenreedy/hirelighter:latest}
    container_name: hirelighter-mail
    profiles: [mail]
    restart: unless-stopped
    command: ["python", "-m", "app.mailwatch"]
    depends_on: [hirelighter]
    environment:
      TZ: ${TZ:-UTC}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_LABEL: ${GMAIL_LABEL:-Jobs}           # only this label is read
      MAIL_CHECK_MINUTES: ${MAIL_CHECK_MINUTES:-15}
      MAIL_AUTO_APPLY: ${MAIL_AUTO_APPLY:-1}      # 0 = every match waits for you in the Jobs tab
    volumes:
      - hirelighter-data:/data
    healthcheck:
      disable: true                             # the image's check is for the web server
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Optional auto-update: `docker compose --profile autoupdate up -d`
  # Checks GHCR every 6 hours and restarts Hirelighter when a new image is published.
  # Note: Watchtower needs the Docker socket, which is root-equivalent on this host.
  watchtower:
    image: containrrr/watchtower:latest
    profiles: [autoupdate]
    restart: unless-stopped
    command: --label-enable --cleanup --interval 21600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  hirelighter-data:
